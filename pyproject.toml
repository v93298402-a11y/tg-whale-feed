[project]
name = "tg-whale-feed"
version = "0.1.0"
description = "Multi-source Telegram whale-feed: posts gift sales >= 100 TON across 7 marketplaces to a channel"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.37",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[project.scripts]
tg-whale-feed = "whale_feed.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whale_feed*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Diagnostic scripts insert the repo root into sys.path before importing
# whale_feed, which is a deliberate exception to E402.
"scripts/*.py" = ["E402"]
